# Durable guestbook/community storage requires a paid web instance and disk.
services:
  - type: web
    name: argo-health-lab
    runtime: node
    plan: starter
    buildCommand: npm ci --include=dev && npm run build:render
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22.16.0
      - key: SQLITE_PATH
        value: /var/data/argo.sqlite
    disk:
      name: argo-data
      mountPath: /var/data
      sizeGB: 1
